aid: consure-medical
name: Consure Medical
description: 'Consure Medical is a nurse-centric medical device company with Silicon Valley roots
  that develops incontinence and critical-care management solutions for hospitals. Its product line
  includes the QiVi family of truly external male and female urine management catheters, the Qora SMK
  manual stool management kit, and the Qoramatic automated stool management system, all designed to
  reduce catheter-associated urinary tract infections (CAUTI), incontinence-associated dermatitis
  (IAD), and hospital-acquired conditions while improving patient dignity. The company operates from
  San Diego, California and New Delhi, India, and markets its devices through partners such as Medline.
  This is a company profile in the API Evangelist network; Consure Medical publishes no public developer
  API, documentation, or specification surface at the time of enrichment.'
